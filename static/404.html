<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofX — Verify</title>
  <script>
    // GitHub Pages SPA fallback:
    // /v/{proof-id} → /verify.html?v={proof-id}
    // Unknown paths → /
    (function() {
      var path = window.location.pathname;
      if (path.startsWith('/v/')) {
        var proofId = path.slice(3);
        window.location.replace('/verify.html?v=' + encodeURIComponent(proofId));
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
