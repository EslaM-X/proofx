name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    name: build binaries + checksums + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: build binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="proofx-${os}-${arch}"
            if [ "$os" = "windows" ]; then ext=".exe"; else ext=""; fi
            echo "building $name"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X github.com/EslaM-X/proofx/cli.Version=${VERSION}" \
              -o "dist/${name}${ext}" ./cmd/proofx
          done

      - name: build WASM verifier
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o dist/proofx.wasm ./cmd/proofx-wasm
          cp static/wasm_exec.js dist/
          echo "WASM built: $(wc -c < dist/proofx.wasm) bytes"

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum proofx-* proofx.wasm wasm_exec.js > checksums.txt
          cat checksums.txt

      - name: build release-sign helper
        run: go build -o dist/release-sign ./tools/release-sign

      - name: sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          echo "$RELEASE_SIGNING_KEY" > /tmp/release-key.pem
          ./dist/release-sign /tmp/release-key.pem dist/checksums.txt > dist/checksums.txt.sig
          echo "signature:"; cat dist/checksums.txt.sig
          rm /tmp/release-key.pem

      - name: create release
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'NOTES'
          # ProofX v0.4.0-rc1 — Execution Proof Model

          ## What's new

          - **v0.4 Execution Proof Model**. Every proof carries Execution,
            Relations, and Claims — making proof structure explicit and
            machine-readable.
          - **3D Coverage**. Evidence, Relations, and Claims are tracked
            independently. Score is computed across all three dimensions.
          - **Graph-based verification**. Claims are verified via the
            relation graph (supports), not just signature.
          - **Native v0.4 prove**. `proofx prove` now generates v0.4 proofs
            with Execution, Relations, and V4Claims.
          - **v0.3 backward compatibility**. v0.4 verifier accepts v0.3
            proofs via automatic conversion.
          - **46-case conformance suite**. Valid, invalid, and malformed
            proofs across v0.3 and v0.4 formats.
          - **Golden vectors**. 5 immutable protocol fixtures defining
            the verification contract.
          - **Cross-version interop**. v0.3→v0.4 = PASS,
            v0.4→v0.3 = REJECT.

          ## Verification pipeline

          Parse → Schema → Evidence Digests → Binding (Merkle v2) →
          Commitment → Signature → Claims (via Relations)

          ## Verify the download

          1. Download the binary and `checksums.txt`.
          2. Compare: `sha256sum -c checksums.txt`
          3. Optionally verify `checksums.txt.sig` with the public release key.

          No proof data is uploaded to any server during browser verification.
          NOTES
          assets=""
          for f in dist/proofx-*; do
            assets="$assets $f"
          done
          assets="$assets dist/proofx.wasm dist/wasm_exec.js dist/checksums.txt dist/checksums.txt.sig"
          gh release create "$GITHUB_REF_NAME" $assets \
            --title "ProofX $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    name: publish docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: lower-case image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
