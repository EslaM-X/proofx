name: Dogfood — ProofX verifies ProofX

on:
  push:
    branches: [main]

jobs:
  dogfood:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ProofX CLI
        run: |
          curl -sSL https://github.com/EslaM-X/proofx/releases/download/v0.3.0/proofx-linux-amd64 -o proofx
          chmod +x proofx
          sudo mv proofx /usr/local/bin/

      - name: Collect evidence
        run: proofx collect

      - name: Generate proof
        run: proofx prove
        env:
          PROOFX_SIGNING_KEY: ${{ secrets.PROOFX_SIGNING_KEY }}

      - name: Verify with proofx-action
        uses: EslaM-X/proofx-action@v0.3.0
        with:
          proof: ./proof.json
          version: "0.3.0"
