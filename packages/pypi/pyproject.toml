[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofx"
version = "0.4.0rc1"
description = "ProofX — Turns software execution into proof that anyone can verify."
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
authors = [
    { name = "EslaM-X", email = "eslam.kora60@gmail.com" },
]
keywords = [
    "cli", "evidence", "verification", "supply-chain", "security",
    "merkle", "cryptography", "provenance", "attestation", "integrity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/EslaM-X/proofx"
Repository = "https://github.com/EslaM-X/proofx"
Issues = "https://github.com/EslaM-X/proofx/issues"

[project.scripts]
proofx = "proofx:main"

[tool.setuptools.packages.find]
include = ["proofx*"]
