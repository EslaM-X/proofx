[package]
name = "proofx-verifier"
version = "0.1.0"
edition = "2024"
description = "Independent Rust verifier for ProofX v0.4 protocol"
license = "MIT"

[[bin]]
name = "proofx-verify"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
hex = "0.4"
